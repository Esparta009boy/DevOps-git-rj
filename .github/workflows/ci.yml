name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Verificar estrutura do projeto
        run: |
          echo " Estrutura do projeto:"
          ls -la
          echo ""
          echo " Verificando arquivos HTML..."
          find . -name "*.html" -type f

      - name: Validar HTML (opcional)
        run: |
          echo " Pipeline concluída com sucesso - Projeto estático"
          echo " Arquivos encontrados:"
          find . -type f -not -path "./.git/*" | wc -l

      - name: Verificar assets
        run: |
          echo " Verificando arquivos CSS:"
          find . -name "*.css" -type f || echo "Nenhum CSS encontrado"
          echo ""
          echo " Verificando imagens:"
          find . -name "*.png" -o -name "*.jpg" -o -name "*.svg" -type f || echo "Nenhuma imagem encontrada"